<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0a0a;
  color: #e0e0e0;

}

}

  color: #ffffff;

  background: #141414;

  font-size: 11px;

  margin-bottom: 6px;

}

  padding: 8px 6px;

/* Method note */
.method-note {
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 12px;
  padding: 18px 16px;
  margin-bottom: 20px;
}

  font-size: 13px;
  font-weight: 600;
  color: #ccc;
  margin-bottom: 10px;

.method-note p {
  font-size: 12px;
  color: #666;
  line-height: 1.7;

  font-family: 'JetBrains Mono', monospace;

/* Loading */
.loading-overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 16px;

.spinner {
  width: 32px; height: 32px;
  border: 3px solid #222;
  border-top-color: #00d4aa;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;

@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: #555; }

/* Watermark */
.watermark {
  position: absolute;
  bottom: 10px;
  right: 16px;
  font-size: 10px;
  color: #333;
  font-family: 'JetBrains Mono', monospace;
}

/* Disclaimer */
.disclaimer {
  text-align: center;
  font-size: 11px;
  color: #444;
  padding: 20px 0;
  line-height: 1.6;
}

/* Share Bar */
.share-bar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}
.share-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 8px 14px;
  border-radius: 6px;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  color: #999;
  font-size: 12px;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.share-btn:hover { background: #222; color: #fff; }

/* Update time */
.update-time {
  text-align: center;
  font-size: 11px;
  color: #444;
  margin-bottom: 20px;
  font-family: 'JetBrains Mono', monospace;
}

@media (max-width: 600px) {
  .info-grid { grid-template-columns: repeat(2, 1fr); }
  .coin-tabs { flex-wrap: wrap; }
  .coin-tab { padding: 8px 14px; font-size: 13px; }
  .header h1 { font-size: 19px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📐 크립토 프랙탈 예측</h1>
    <p>최근 30일 가격 패턴과 유사한 과거 구간을 찾아<br>향후 7일 가격 시나리오를 투영합니다</p>
  </div>

  <div class="coin-tabs" id="coinTabs"></div>
  <div id="mainContent">
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">데이터 로딩 중...</div>
    </div>
  </div>
</div>

<script>
const COINS = [
  { id: 'bitcoin', symbol: 'BTC', name: 'Bitcoin', color: '#f7931a', icon: 'assets/bitcoin.svg' },
  { id: 'ethereum', symbol: 'ETH', name: 'Ethereum', color: '#627eea', icon: 'assets/ethereum.png' },
  { id: 'solana', symbol: 'SOL', name: 'Solana', color: '#9945ff', icon: 'assets/solana.png' }
];

const LOOKBACK = 30;   // 패턴 매칭 윈도우 (30일)
const FORWARD = 7;     // 예측 기간 (7일)
const TOP_N = 15;      // 상위 유사 패턴 수

let coinData = {};
let currentCoin = 'bitcoin';
let chartInstance = null;

// ── CSV 로드 ──
async function loadCSV(coinId) {
  const url = `data/${coinId}.csv`;
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (result) => {
        const rows = result.data
          .filter(r => r.snapped_at && r.price)
          .map(r => ({
            date: r.snapped_at.split(' ')[0],
            price: parseFloat(r.price)
          }))
          .filter(r => !isNaN(r.price) && r.price > 0)
          .sort((a, b) => a.date.localeCompare(b.date));
        resolve(rows);
      },
      error: reject
    });
  });
}

// ── 일일 수익률 계산 ──
function dailyReturns(prices) {
  const ret = [];
  for (let i = 1; i < prices.length; i++) {
    ret.push((prices[i] - prices[i-1]) / prices[i-1]);
  }
  return ret;
}

// ── 피어슨 상관계수 ──
function pearson(a, b) {
  if (a.length !== b.length || a.length === 0) return 0;
  const n = a.length;
  const meanA = a.reduce((s,v) => s+v, 0) / n;
  const meanB = b.reduce((s,v) => s+v, 0) / n;
  let num = 0, denA = 0, denB = 0;
  for (let i = 0; i < n; i++) {
    const da = a[i] - meanA;
    const db = b[i] - meanB;
    num += da * db;
    denA += da * da;
    denB += db * db;
  }
  const den = Math.sqrt(denA) * Math.sqrt(denB);
  return den === 0 ? 0 : num / den;
}

// ── 프랙탈 분석 핵심 로직 ──
function fractalAnalysis(data) {
  const prices = data.map(d => d.price);
  const dates = data.map(d => d.date);
  const n = prices.length;

  // 최근 30일의 일일 수익률
  const currentWindow = prices.slice(n - LOOKBACK);
  const currentReturns = dailyReturns(currentWindow);
  const currentPrice = prices[n - 1];
  const currentDate = dates[n - 1];

  // 과거 전체를 슬라이딩하며 유사 패턴 검색
  const matches = [];
  const minIdx = LOOKBACK; // 최소 lookback일 이후부터
  const maxIdx = n - LOOKBACK - FORWARD; // forward 기간 확보

  for (let i = minIdx; i <= maxIdx; i++) {
    const window = prices.slice(i, i + LOOKBACK);
    const returns = dailyReturns(window);
    const corr = pearson(currentReturns, returns);

    if (corr > 0.5) { // 최소 상관계수 0.5 이상만
      // 이후 7일 수익률
      const fwdPrices = prices.slice(i + LOOKBACK, i + LOOKBACK + FORWARD);
      const basePrice = prices[i + LOOKBACK - 1];
      const fwdReturns = fwdPrices.map(p => (p - basePrice) / basePrice);

      matches.push({
        startDate: dates[i],
        endDate: dates[i + LOOKBACK - 1],
        correlation: corr,
        fwdReturns: fwdReturns,
        fwdFinalReturn: fwdReturns[fwdReturns.length - 1] || 0,
        basePrice: basePrice
      });
    }
  }

  // 상관계수 기준 정렬 후 Top-N
  matches.sort((a, b) => b.correlation - a.correlation);
  const topMatches = matches.slice(0, TOP_N);

  if (topMatches.length === 0) {
    return { error: '유사 패턴을 찾을 수 없습니다', currentPrice, currentDate };
  }

  // 시나리오 계산
  const allFwdReturns = topMatches.map(m => m.fwdReturns);
  const numDays = Math.min(...allFwdReturns.map(r => r.length));

  const scenarios = { bullish: [], bearish: [], average: [], dates: [] };
  const lastDate = new Date(currentDate);

  for (let d = 0; d < numDays; d++) {
    const dayReturns = allFwdReturns.map(r => r[d]).filter(v => v !== undefined);
    dayReturns.sort((a, b) => a - b);

    const avg = dayReturns.reduce((s,v) => s+v, 0) / dayReturns.length;
    // Bullish: 상위 25% 평균, Bearish: 하위 25% 평균
    const q1 = Math.floor(dayReturns.length * 0.25);
    const q3 = Math.floor(dayReturns.length * 0.75);
    const bearish = dayReturns.slice(0, Math.max(q1, 1)).reduce((s,v) => s+v, 0) / Math.max(q1, 1);
    const bullish = dayReturns.slice(q3).reduce((s,v) => s+v, 0) / (dayReturns.length - q3);

    scenarios.bullish.push(currentPrice * (1 + bullish));
    scenarios.bearish.push(currentPrice * (1 + bearish));
    scenarios.average.push(currentPrice * (1 + avg));

    const nextDate = new Date(lastDate);
    nextDate.setDate(nextDate.getDate() + d + 1);
    scenarios.dates.push(nextDate.toISOString().split('T')[0]);
  }

  // 최근 30일 가격 (차트 왼쪽)
  const historyPrices = prices.slice(n - LOOKBACK);
  const historyDates = dates.slice(n - LOOKBACK);

  return {
    currentPrice,
    currentDate,
    scenarios,
    topMatches,
    totalMatches: matches.length,
    historyPrices,
    historyDates,
    bullishTarget: scenarios.bullish[scenarios.bullish.length - 1],
    bearishTarget: scenarios.bearish[scenarios.bearish.length - 1],
    avgTarget: scenarios.average[scenarios.average.length - 1]
  };
}

// ── 차트 렌더링 ──
function renderChart(result, coin) {
  const ctx = document.getElementById('fractalChart');
  if (!ctx) return;

  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }

  // 라벨: 과거 30일 + 미래 7일
  const labels = [...result.historyDates, ...result.scenarios.dates];

  // 과거 가격 데이터 (미래 부분은 null)
  const histData = [...result.historyPrices, ...result.scenarios.dates.map(() => null)];

  // 미래 시나리오 (과거 부분은 null, 마지막 과거 가격을 시작점으로 연결)
  const pad = result.historyDates.map(() => null);
  const connector = result.currentPrice;

  const bullData = [...pad.slice(0, -1), connector, ...result.scenarios.bullish];
  const bearData = [...pad.slice(0, -1), connector, ...result.scenarios.bearish];
  const avgData = [...pad.slice(0, -1), connector, ...result.scenarios.average];

  const coinColor = coin.color;

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels.map(d => d.slice(5)),  // MM-DD 형식
      datasets: [
        {
          label: '실제 가격',
          data: histData,
          borderColor: coinColor,
          backgroundColor: coinColor + '15',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          fill: true,
          order: 1
        },
        {
          label: 'Bullish (상위 25%)',
          data: bullData,
          borderColor: '#00d4aa',
          borderWidth: 2,
          borderDash: [6, 3],
          pointRadius: 0,
          tension: 0.3,
          fill: false,
          order: 2
        },
        {
          label: 'Average (평균)',
          data: avgData,
          borderColor: '#ffd700',
          borderWidth: 2,
          borderDash: [4, 4],
          pointRadius: 0,
          tension: 0.3,
          fill: false,
          order: 3
        },
        {
          label: 'Bearish (하위 25%)',
          data: bearData,
          borderColor: '#ff4d6a',
          borderWidth: 2,
          borderDash: [6, 3],
          pointRadius: 0,
          tension: 0.3,
          fill: false,
          order: 4
        },
        {
          label: 'Bullish 밴드',
          data: bullData,
          borderColor: 'transparent',
          backgroundColor: '#00d4aa10',
          pointRadius: 0,
          fill: '+1',
          tension: 0.3,
          order: 5
        },
        {
          label: 'Bearish 밴드',
          data: bearData,
          borderColor: 'transparent',
          backgroundColor: '#ff4d6a10',
          pointRadius: 0,
          fill: '-1',
          tension: 0.3,
          order: 6
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          position: 'top',
          labels: {
            color: '#666',
            font: { family: "'Noto Sans KR'", size: 11 },
            boxWidth: 12,
            padding: 12,
            filter: (item) => !item.text.includes('밴드'),
            usePointStyle: true,
            pointStyle: 'line'
          }
        },
        tooltip: {
          backgroundColor: '#1a1a1a',
          borderColor: '#333',
          borderWidth: 1,
          titleColor: '#999',
          bodyColor: '#eee',
          titleFont: { family: "'JetBrains Mono'", size: 11 },
          bodyFont: { family: "'JetBrains Mono'", size: 12 },
          callbacks: {
            label: function(ctx) {
              if (ctx.raw === null) return null;
              const v = ctx.raw;
              return ` ${ctx.dataset.label}: $${v >= 100 ? v.toLocaleString('en',{maximumFractionDigits:0}) : v.toFixed(2)}`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#1a1a1a' },
          ticks: {
            color: '#555',
            font: { family: "'JetBrains Mono'", size: 10 },
            maxTicksLimit: 12,
            maxRotation: 0
          }
        },
        y: {
          position: 'right',
          grid: { color: '#1a1a1a' },
          ticks: {
            color: '#555',
            font: { family: "'JetBrains Mono'", size: 10 },
            callback: function(v) {
              return v >= 1000 ? '$' + (v/1000).toFixed(1) + 'k' : '$' + v.toFixed(2);
            }
          }
        }
      },
      // 예측 영역 구분선
      annotation: {}
    },
    plugins: [{
      id: 'dividerLine',
      afterDraw: (chart) => {
        const meta = chart.getDatasetMeta(0);
        const lastPoint = meta.data.filter(p => p && p.x).pop();
        if (!lastPoint) return;
        const ctx = chart.ctx;
        const yAxis = chart.scales.y;
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.moveTo(lastPoint.x, yAxis.top);
        ctx.lineTo(lastPoint.x, yAxis.bottom);
        ctx.stroke();
        ctx.fillStyle = '#444';
        ctx.font = "10px 'JetBrains Mono'";
        ctx.fillText('← 실제 | 예측 →', lastPoint.x - 42, yAxis.top + 12);
        ctx.restore();
      }
    }]
  });
}

// ── UI 렌더링 ──
function renderDashboard(result, coin) {
  if (result.error) {
    document.getElementById('mainContent').innerHTML = `
      <div class="loading-overlay">
        <div style="color:#ff4d6a;font-size:14px;">${result.error}</div>
      </div>`;
    return;
  }

  const cp = result.currentPrice;
  const fmt = (v) => v >= 100 ? '$' + v.toLocaleString('en', {maximumFractionDigits: 0}) : '$' + v.toFixed(2);
  const pct = (v) => {
    const p = ((v - cp) / cp * 100);
    return (p >= 0 ? '+' : '') + p.toFixed(1) + '%';
  };
  const pctClass = (v) => v >= cp ? 'bullish' : 'bearish';

  const matchRows = result.topMatches.slice(0, 10).map((m, i) => {
    const retClass = m.fwdFinalReturn >= 0 ? 'pos' : 'neg';
    const retStr = (m.fwdFinalReturn >= 0 ? '+' : '') + (m.fwdFinalReturn * 100).toFixed(1) + '%';
    return `<tr>
      <td>${i + 1}</td>
      <td>${m.startDate.slice(2)} ~ ${m.endDate.slice(2)}</td>
      <td class="corr">${m.correlation.toFixed(3)}</td>
      <td class="${retClass}">${retStr}</td>
    </tr>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="update-time">마지막 업데이트: ${result.currentDate} · 유사 패턴 ${result.totalMatches}개 중 상위 ${result.topMatches.length}개 분석</div>

    <div class="info-grid">
      <div class="info-card">
        <div class="label">현재가</div>
        <div class="value">${fmt(cp)}</div>
      </div>
      <div class="info-card">
        <div class="label">🟢 Bullish (7일)</div>
        <div class="value bullish">${fmt(result.bullishTarget)}<br><span style="font-size:11px">${pct(result.bullishTarget)}</span></div>
      </div>
      <div class="info-card">
        <div class="label">🟡 Average (7일)</div>
        <div class="value ${pctClass(result.avgTarget)}">${fmt(result.avgTarget)}<br><span style="font-size:11px">${pct(result.avgTarget)}</span></div>
      </div>
      <div class="info-card">
        <div class="label">🔴 Bearish (7일)</div>
        <div class="value bearish">${fmt(result.bearishTarget)}<br><span style="font-size:11px">${pct(result.bearishTarget)}</span></div>
      </div>
    </div>

    <div class="chart-wrapper">
      <div class="chart-title-row">
        <div class="chart-title">${coin.name} 프랙탈 예측 차트</div>
        <div class="chart-subtitle">LOOKBACK ${LOOKBACK}D → FORWARD ${FORWARD}D</div>
      </div>
      <div style="height:380px;position:relative;">
        <canvas id="fractalChart"></canvas>
      </div>
      <div class="watermark">Herdvibe.com</div>
    </div>

    <div class="match-section">
      <h3>🔍 상위 유사 패턴 (피어슨 상관계수 기준)</h3>
      <table class="match-table">
        <thead>
          <tr><th>#</th><th>기간</th><th>상관계수</th><th>이후 7일 수익률</th></tr>
        </thead>
        <tbody>${matchRows}</tbody>
      </table>
    </div>

    <div class="method-note">
      <h3>📊 분석 방법론</h3>
      <p>
        최근 <code>${LOOKBACK}일</code>간의 일일 수익률 패턴을 과거 전체 히스토리에서 슬라이딩 윈도우 방식으로 검색합니다.
        피어슨 상관계수 <code>r > 0.5</code> 이상인 구간을 추출한 뒤, 상위 <code>${TOP_N}개</code> 유사 패턴의
        이후 <code>${FORWARD}일</code> 가격 경로를 분석합니다.
        Bullish는 상위 25% 평균, Bearish는 하위 25% 평균, Average는 전체 평균입니다.
        이 분석은 과거 패턴의 통계적 유사성에 기반하며, 미래 가격을 보장하지 않습니다.
      </p>
    </div>

    <div class="share-bar">
      <button class="share-btn" onclick="shareTwitter()">𝕏 공유</button>
      <button class="share-btn" onclick="shareKakao()">💬 카카오톡</button>
      <button class="share-btn" onclick="shareTelegram()">✈️ 텔레그램</button>
      <button class="share-btn" onclick="copyLink()">🔗 링크복사</button>
    </div>

    <div class="disclaimer">
      ⚠️ 본 자료는 정보 제공 목적이며 투자 조언이 아닙니다.<br>
      과거 패턴은 미래 수익을 보장하지 않습니다. 투자 결정은 본인의 판단에 따라 이루어져야 합니다.
    </div>
  `;

  renderChart(result, coin);
}

// ── 코인 탭 렌더링 ──
function renderTabs() {
  const tabsEl = document.getElementById('coinTabs');
  tabsEl.innerHTML = COINS.map(c => `
    <div class="coin-tab ${c.id === currentCoin ? 'active' : ''}"
         style="--coin-color:${c.color}"
         onclick="switchCoin('${c.id}')">
      <img src="${c.icon}" alt="${c.symbol}" onerror="this.style.display='none'">
      <span>${c.symbol}</span>
    </div>
  `).join('');
}

// ── 코인 전환 ──
async function switchCoin(coinId) {
  currentCoin = coinId;
  renderTabs();
  const coin = COINS.find(c => c.id === coinId);

  if (!coinData[coinId]) {
    document.getElementById('mainContent').innerHTML = `
      <div class="loading-overlay"><div class="spinner"></div><div class="loading-text">${coin.name} 데이터 분석 중...</div></div>`;
    try {
      coinData[coinId] = await loadCSV(coinId);
    } catch(e) {
      document.getElementById('mainContent').innerHTML = `
        <div class="loading-overlay"><div style="color:#ff4d6a">데이터 로드 실패: ${e.message}</div></div>`;
      return;
    }
  }

  const result = fractalAnalysis(coinData[coinId]);
  renderDashboard(result, coin);
}

// ── 공유 기능 ──
function shareTwitter() {
  const coin = COINS.find(c => c.id === currentCoin);
  const text = `📐 ${coin.name} 프랙탈 예측 - 향후 7일 가격 시나리오 by HerdVibe`;
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(location.href)}`);
}
function shareKakao() {
  if (window.Kakao && Kakao.isInitialized()) {
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title: '크립토 프랙탈 예측 | HerdVibe',
        description: '과거 패턴 기반 향후 7일 가격 시나리오',
        imageUrl: '',
        link: { mobileWebUrl: location.href, webUrl: location.href }
      }
    });
  }
}
function shareTelegram() {
  window.open(`https://t.me/share/url?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent('크립토 프랙탈 예측 - HerdVibe')}`);
}
function copyLink() {
  navigator.clipboard.writeText(location.href).then(() => {
    const btn = event.target;
    btn.textContent = '✅ 복사됨!';
    setTimeout(() => btn.textContent = '🔗 링크복사', 1500);
  });
}

// ── Kakao SDK ──
(function() {
  const s = document.createElement('script');
  s.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.6.0/kakao.min.js';
  s.onload = () => { if (window.Kakao) Kakao.init('a43ed7b39fac35458f4f9df925a279b5'); };
  document.head.appendChild(s);
})();

// ── 초기화 ──
renderTabs();
switchCoin('bitcoin');
</script>
</body>
